version: '3.9'

services:
  # Наша база данных
  postgres:
    image: postgres:15-alpine  # alpine — легковесный образ (~20MB вместо ~400MB)
    container_name: avito_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Данные БД сохраняются на диск, чтобы не терять их при перезапуске
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Эта штука говорит compose: "не считай контейнер живым, пока БД не ответит"
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - avito_network

  # Наше Go-приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avito_app
    ports:
      - "${APP_PORT}:8080"
    environment:
      - DB_HOST=postgres  # ВАЖНО: имя сервиса из docker-compose, а не localhost!
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - APP_PORT=${APP_PORT}
    depends_on:
      postgres:
        condition: service_healthy  # Ждем, пока БД реально поднимется
    networks:
      - avito_network

volumes:
  postgres_data:  # Именованный volume для персистентности данных

networks:
  avito_network:
    driver: bridge